<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Registration | Bright Light Church</title><link rel="stylesheet" href="styles.css"></head>
<body><header><strong>BRIGHT LIGHT CHURCH</strong><div>Member Registration</div></header><main>
<h1>Church Member Portal</h1><p>Create an account or sign in to submit your member profile. Updates are reviewed by church administration.</p><div id="message" class="hidden" role="status" aria-live="polite"></div>
<section id="authPanel" class="panel"><h2>Sign in or create an account</h2><form id="authForm"><div class="grid"><label>Email<input required name="email" type="email" autocomplete="email"></label><label>Password<input required name="password" type="password" minlength="8" autocomplete="current-password"></label></div><button type="submit">Sign in</button><button type="button" id="signUp" class="secondary">Create account</button></form><small>Confirm your email if Supabase email confirmation is enabled.</small></section>
<section id="profilePanel" class="panel hidden"><div class="row"><h2>My member profile</h2><button type="button" id="signOut" class="secondary">Sign out</button></div><p id="profileStatus"></p><form id="profileForm"><div class="grid">
<label>First name *<input name="first_name" required maxlength="100"></label><label>Last name *<input name="last_name" required maxlength="100"></label><label>Preferred name<input name="preferred_name"></label><label>Contact email<input name="email" type="email"></label><label>Phone<input name="phone" type="tel"></label><label>Birth date<input name="date_of_birth" type="date"></label><label>Wedding anniversary<input name="anniversary_date" type="date"></label>
</div><button type="submit">Save member profile</button></form></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="blc-common.js"></script><script src="member.js"></script></body></html>
