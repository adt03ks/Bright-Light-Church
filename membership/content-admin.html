<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bright Light Church | Content Manager</title><link rel="stylesheet" href="content-manager.css"></head><body>
<header><strong>BRIGHT LIGHT CHURCH</strong><span>Website Content Manager</span><nav><a href="admin.html">Member Administration</a> <a href="../index.html">Website</a></nav></header>
<main><h1>Edit website pictures &amp; captions</h1><p class="muted">Use a page key and slot key matching the content area you installed on your website. Publishing makes content visible to visitors.</p><p id="notice" role="status"></p>
<section id="signin-panel"><h2>Sign in</h2><form id="signin"><label>Email <input id="email" type="email" autocomplete="username" required></label><label>Password <input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form></section>
<section id="editor-panel" hidden><div class="top"><strong id="signed-in"></strong><button id="logout" type="button">Sign out</button></div>
<div class="grid"><section class="panel"><h2>Content entries</h2><label>Filter by page <input id="filter" placeholder="e.g. home"></label><button id="reload" type="button">Refresh entries</button><div id="entries"></div></section>
<section class="panel"><h2>Content editor</h2><form id="content-form"><label>Page key <input name="page_key" id="page-key" required pattern="[a-z0-9][a-z0-9_-]*" placeholder="home"></label><label>Slot key <input name="slot_key" id="slot-key" required pattern="[a-z0-9][a-z0-9_-]*" placeholder="hero"></label><label>Headline <input name="title" id="title" maxlength="250"></label><label>Caption <textarea name="caption" id="caption" maxlength="2500" rows="5"></textarea></label><label>Image alt text (accessibility) <input name="image_alt" id="alt" maxlength="250"></label><label>Upload replacement image (JPEG, PNG, WebP, GIF; max 5 MB) <input id="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><label>Existing image path <input id="image-path" readonly placeholder="No image uploaded"></label><img id="preview" alt="Selected image preview" hidden><label class="checkbox"><input id="published" type="checkbox"> Published (visible on public website)</label><button type="submit">Save content</button><button id="new" type="button" class="outline">New content slot</button></form></section></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js"></script><script src="content-admin.js" defer></script></body></html>
